{% extends 'base.html' %}

{% block title %}Sign In - FitLife{% endblock %}

{% block public_content %}
<div class="min-h-[80vh] flex flex-col items-center justify-center px-4 bg-slate-50">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-xl shadow-slate-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-slate-900">Welcome Back</h2>
            <p class="text-sm text-slate-500 mt-2">Log in to track today's goals</p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">Username or Email</label>
                <input type="text" name="email" id="email" required
                       class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 border-slate-300"
                       placeholder="you@example.com or username">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <input type="password" name="password" id="password" required
                       class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 border-slate-300"
                       placeholder="••••••••">
            </div>

            <button type="submit" 
                    class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 px-4 rounded-xl transition shadow-md shadow-brand-100">
                Sign In
            </button>
        </form>

        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
            <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-slate-400">Or continue with</span></div>
        </div>

        <a href="{% url 'accounts:google_login' %}" 
           class="w-full bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl border border-slate-300 transition flex items-center justify-center space-x-3 shadow-sm">
            <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12 5.04c1.66 0 3.2.57 4.38 1.69l3.27-3.27C17.67 1.54 15.01 1 12 1 7.35 1 3.39 3.65 1.54 7.54l3.88 3A7.006 7.006 0 0 1 12 5.04z"/>
                <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.27H12v4.51h6.46a5.53 5.53 0 0 1-2.4 3.62l3.73 2.89c2.18-2.01 3.7-4.98 3.7-8.75z"/>
                <path fill="#FBBC05" d="M5.42 14.54A7.148 7.148 0 0 1 5 12c0-.88.15-1.74.42-2.54l-3.88-3a11.96 11.96 0 0 0 0 11.08l3.88-3z"/>
                <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.92l-3.73-2.89a7.03 7.03 0 0 1-10.79-3.65l-3.88 3C3.39 20.35 7.35 23 12 23z"/>
            </svg>
            <span>Continue with Google</span>
        </a>

        <div class="mt-8 text-center text-sm text-slate-500">
            Don't have an account? 
            <a href="{% url 'accounts:register' %}" class="text-brand-600 hover:text-brand-700 font-semibold">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}
